name: MedCore Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build
        working-directory: backend
        run: mvn clean package -DskipTests

      - name: Build Docker image
        working-directory: backend
        run: docker build -t medcore-backend:ci .
