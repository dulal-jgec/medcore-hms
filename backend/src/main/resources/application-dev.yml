spring:

  config:
    import: optional:file:.env[.properties]

  application:
    name: ${APP_NAME}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USER:default}
      password: ${REDIS_PASSWORD}

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  flyway:
    baseline-on-migrate: true
    baseline-version: 23

  # Updated for SendGrid SMTP
  mail:
    host: smtp.sendgrid.net
    port: 587
    username: apikey # SendGrid requires this exact string
    password: ${SENDGRID_API_KEY} # This will come from Render Environment Variables
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

app:
  super-admin:
    email: ${SUPER_ADMIN_EMAIL}
    password: ${SUPER_ADMIN_PASSWORD}
    phone: ${SUPER_ADMIN_PHONE}
  
  # Added custom property for the sender email
  mail:
    from: ${MAIL_FROM}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION}


razorpay:
  key-id: ${RAZORPAY_KEY_ID}
  key-secret: ${RAZORPAY_KEY_SECRET}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET}


cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}


logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN


server:
  port: ${SERVER_PORT:8080}